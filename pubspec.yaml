name: kabulfit_mobile
description: KabulFit mobile commerce client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  connectivity_plus: '>=7.0.0 <7.3.0'
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_stripe: ^14.2.0
  flutter_secure_storage: ^10.0.0
  go_router: ^17.0.0
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.4
  uuid: ^4.5.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/kabulfit-original-logo.png
    - assets/brand/kabulfit-original-logo-white.png

# The square master image is created from the original KabulFit favicon
# before each native build: dart run tool/prepare_app_icon.dart
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/kabulfit-icon-square.png
  adaptive_icon_background: "#FFFCF8"
  adaptive_icon_foreground: assets/brand/kabulfit-app-symbol.png
  remove_alpha_ios: true
  background_color_ios: "#FFFCF8"
