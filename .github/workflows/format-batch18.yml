name: Format Batch 18 Dart
on:
  push:
    branches: ['feat/batch-18-opt-in-demo-catalog']
    paths:
      - '.github/workflows/format-batch18.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/batch-18-opt-in-demo-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/features/catalog/application/demo_catalog.dart lib/features/catalog/presentation/catalog_screen.dart
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/catalog/application/demo_catalog.dart lib/features/catalog/presentation/catalog_screen.dart
            git commit -m "style: dart format batch 18 catalog"
            git push origin HEAD:feat/batch-18-opt-in-demo-catalog
          fi
