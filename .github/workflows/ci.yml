name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-batch18:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/batch-18-opt-in-demo-catalog'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/features/catalog/application/demo_catalog.dart lib/features/catalog/presentation/catalog_screen.dart
      - name: Commit formatted code
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/catalog/application/demo_catalog.dart lib/features/catalog/presentation/catalog_screen.dart
            git commit -m "style: format Batch 18 catalog"
            git push origin HEAD:feat/batch-18-opt-in-demo-catalog
          fi
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Build development APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned production APK
        run: >-
          flutter build apk --release --flavor production
          -t lib/main_production.dart
          --dart-define=API_BASE_URL=https://example.invalid/api/v1

  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iOS without signing
        run: >-
          flutter build ios --release --no-codesign
          -t lib/main_production.dart
          --dart-define=API_BASE_URL=https://kabulfit.com/api/v1
          --dart-define=DEMO_CATALOG=${{ github.ref_name == 'feat/batch-18-opt-in-demo-catalog' && 'true' || 'false' }}
      - name: Package unsigned IPA for preflight only
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p "$RUNNER_TEMP/kabulfit-unsigned/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/kabulfit-unsigned/Payload/Runner.app"
          (
            cd "$RUNNER_TEMP/kabulfit-unsigned"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/KabulFit-UNSIGNED.ipa" Payload
          )
          test -s KabulFit-UNSIGNED.ipa
          shasum -a 256 KabulFit-UNSIGNED.ipa > SHA256SUMS.txt
      - name: Upload unsigned IPA preflight archive
        uses: actions/upload-artifact@v4
        with:
          name: kabulfit-ios-unsigned-preflight
          path: |
            KabulFit-UNSIGNED.ipa
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
