name: Format feature branch (temporary)
on:
  push:
    branches:
      - feat/batch-16-localization-polish
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-16-localization-polish
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Dart files
        run: dart format lib test
      - name: Commit formatted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize Dart formatting"
            git push origin HEAD:feat/batch-16-localization-polish
          fi
