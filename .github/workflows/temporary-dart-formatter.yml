name: Temporary final Flutter formatter

on:
  push:
    branches: [feat/batch-19-luxury-showcase-ui]
    paths: [.github/workflows/temporary-dart-formatter.yml]

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-19-luxury-showcase-ui
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Run exact formatter and remove helper
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git rm -f .github/workflows/temporary-dart-formatter.yml
          git commit -m "style: CI Dart formatter for secure measurement draft"
          git push origin HEAD:feat/batch-19-luxury-showcase-ui
