name: Temporary Dart formatter

on:
  push:
    branches:
      - feat/batch-19-luxury-showcase-ui
    paths:
      - .github/workflows/temporary-dart-formatter.yml

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-19-luxury-showcase-ui
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format Dart and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git rm -f .github/workflows/temporary-dart-formatter.yml
          git commit -m "style: format luxury fashion Flutter storefront"
          git push origin HEAD:feat/batch-19-luxury-showcase-ui
