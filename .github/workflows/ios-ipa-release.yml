name: iOS IPA Release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production HTTPS Laravel API base URL
        required: true
        default: https://kabulfit.com/api/v1
        type: string
      distribution_method:
        description: Apple distribution method
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store

permissions:
  contents: read

jobs:
  signed-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release prerequisites
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" =~ ^https:// ]] || { echo "Production API must use HTTPS"; exit 1; }
          for key in CERT_B64 CERT_PASSWORD PROFILE_B64 TEAM_ID BUNDLE_ID KEYCHAIN_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "Missing iOS release secret: $key"; exit 1; }
          done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install signing certificate and profile
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/kabulfit-signing.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure signing and export
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          EXPORT_METHOD: ${{ inputs.distribution_method }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist 2>/dev/null || true
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          text = p.read_text()
          import re
          text = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = {os.environ["TEAM_ID"]};', text)
          text = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;', f'PRODUCT_BUNDLE_IDENTIFIER = {os.environ["BUNDLE_ID"]};', text)
          p.write_text(text)
          PY
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          EOF

      - name: Test and build signed IPA
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        shell: bash
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build ipa --release -t lib/main_production.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kabulfit-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
