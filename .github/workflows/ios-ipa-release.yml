name: KabulFit iOS Signed IPA

on:
  push:
    branches:
      - feat/batch-19-luxury-showcase-ui
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Verified HTTPS Laravel API base URL (staging until final domain cutover)
        required: true
        default: https://kabulfit.businessos.af/api/v1
        type: string
      distribution_method:
        description: Apple distribution method
        required: true
        default: app-store
        type: choice
        options:
          - ad-hoc
          - app-store

permissions:
  contents: read

jobs:
  signed-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release prerequisites
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://kabulfit.businessos.af/api/v1' }}
          CERT_B64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" =~ ^https:// ]] || { echo "Laravel API must use HTTPS"; exit 1; }
          for key in CERT_B64 CERT_PASSWORD PROFILE_B64 TEAM_ID BUNDLE_ID KEYCHAIN_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "Missing iOS release secret: $key"; exit 1; }
          done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install signing certificate and profile
        env:
          CERT_B64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/kabulfit-signing.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure signing and export
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          EXPORT_METHOD: ${{ inputs.distribution_method || 'app-store' }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist 2>/dev/null || true
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          text = p.read_text()
          import re
          team = os.environ['TEAM_ID']
          bundle = os.environ['BUNDLE_ID']
          profile = os.environ['PROFILE_UUID']
          if not re.fullmatch(r'[A-Z0-9]{10}', team):
              raise SystemExit('Invalid Apple Team ID')
          if not re.fullmatch(r'[a-zA-Z0-9.-]+', bundle):
              raise SystemExit('Invalid iOS bundle ID')
          if not re.fullmatch(r'[A-Za-z0-9-]+', profile):
              raise SystemExit('Invalid provisioning profile UUID')
          settings = (
              f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};\n'
              f'                DEVELOPMENT_TEAM = {team};\n'
              '                CODE_SIGN_STYLE = Manual;\n'
              f'                PROVISIONING_PROFILE_SPECIFIER = {profile};\n'
              '                CODE_SIGN_IDENTITY = "Apple Distribution";'
          )
          text, count = re.subn(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;', lambda _: settings, text)
          if count == 0:
              raise SystemExit('Cannot locate Runner iOS bundle identifier settings')
          p.write_text(text)
          PY
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          EOF

      - name: Test and build signed IPA
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://kabulfit.businessos.af/api/v1' }}
        shell: bash
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build ipa --release -t lib/main_production.dart \
            --build-number="$(date -u +%Y%m%d%H%M)" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"

      - name: Name and checksum IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          if [[ "$IPA_PATH" != "build/ios/ipa/KabulFit.ipa" ]]; then
            mv "$IPA_PATH" build/ios/ipa/KabulFit.ipa
          fi
          shasum -a 256 build/ios/ipa/KabulFit.ipa | tee build/ios/ipa/SHA256SUMS.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kabulfit-ios-ipa
          path: |
            build/ios/ipa/KabulFit.ipa
            build/ios/ipa/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ (inputs.distribution_method || 'app-store') == 'app-store' }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [[ -n "${!key}" ]] || { echo "Missing App Store Connect secret: $key"; exit 1; }
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/KabulFit.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY_PATH"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
