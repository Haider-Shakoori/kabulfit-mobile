name: Temporary analyzer autofix
on:
  push:
    branches: [feat/batch-16-localization-polish]
permissions:
  contents: write
jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-16-localization-polish
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply Dart analyzer fixes
        run: dart fix --apply
      - name: Format Dart files
        run: dart format lib test
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply Dart analyzer suggestions"
            git push origin HEAD:feat/batch-16-localization-polish
          fi
