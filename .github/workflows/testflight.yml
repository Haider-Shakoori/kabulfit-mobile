name: KabulFit iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the signed IPA to TestFlight (uncheck to build only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kabulfit-ios-testflight
  cancel-in-progress: false

jobs:
  ios-testflight:
    name: Build signed iOS app
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify required Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 - <<'PY'
          import subprocess
          sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], text=True).strip()
          if int(sdk.split('.')[0]) < 26:
              raise SystemExit(f'Apple requires iOS SDK 26 or newer; found {sdk}')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Apple configuration
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          CERT_FILE: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          for name in TEAM_ID ISSUER_ID API_KEY_ID API_PRIVATE_KEY CERT_FILE CERT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions credential/variable: $name"
              exit 1
            fi
          done

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate branded iOS App Store icon
        run: |
          dart run tool/prepare_app_icon.dart
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          directory = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          catalog = json.loads((directory / 'Contents.json').read_text())
          entries = catalog.setdefault('images', [])
          master = Path('assets/brand/kabulfit-icon-square.png')
          data = master.read_bytes()
          if data[:8] != b'\\x89PNG\\r\\n\\x1a\\n':
              raise SystemExit('App icon master is not PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1024, 1024):
              raise SystemExit(f'App icon must be 1024x1024, found {width}x{height}')
          destination = directory / 'Icon-App-1024x1024.png'
          destination.write_bytes(data)
          entries = [item for item in entries if not (item.get('idiom') == 'ios-marketing' or (item.get('idiom') == 'universal' and item.get('size') == '1024x1024'))]
          entries.append({'idiom': 'ios-marketing', 'size': '1024x1024', 'scale': '1x', 'filename': destination.name})
          catalog['images'] = entries
          (directory / 'Contents.json').write_text(json.dumps(catalog, indent=2) + '\\n')
          print('Verified 1024x1024 App Store icon in iOS asset catalog')
          PY

      - name: Install Xcode project editor
        run: gem install xcodeproj --no-document

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store Connect provisioning profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: af.kabulfit.mobile
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Verify requested provisioning profile
        env:
          PROFILES_JSON: ${{ steps.profiles.outputs.profiles }}
        run: |
          profile_name=$(jq -r '[.[] | select(.name == "KabulFit AppStore" and .type == "IOS_APP_STORE")] | first | .name // empty' <<<"$PROFILES_JSON")
          if [ -z "$profile_name" ]; then
            echo "::error::No active IOS_APP_STORE profile named KabulFit AppStore for af.kabulfit.mobile"
            exit 1
          fi
          echo "APPSTORE_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Configure temporary manual signing settings
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'Xcode Runner target not found' unless target

          %w[Release Profile].each do |configuration_name|
            config = target.build_configurations.find { |c| c.name == configuration_name }
            abort "Missing Xcode configuration: #{configuration_name}" unless config

            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('APPSTORE_PROFILE_NAME')
          end

          project.save
          RUBY

          python3 <<'PY'
          import os
          import plistlib
          settings = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": os.environ["TEAM_ID"],
              "provisioningProfiles": {
                  "af.kabulfit.mobile": os.environ["APPSTORE_PROFILE_NAME"]
              },
          }
          with open("ios/ExportOptions.plist", "wb") as output:
              plistlib.dump(settings, output)
          PY

      - name: Patch connectivity_plus Swift SDK compatibility
        run: |
          plugin_file=$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/connectivity_plus-*/ios/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift' -print -quit)
          if [ -z "$plugin_file" ]; then
            echo "::error::connectivity_plus Swift source not found"
            exit 1
          fi
          python3 - "$plugin_file" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          needle = 'path.isUltraConstrained'
          if needle not in source:
              print('No incompatible NWPath property found; leaving plugin unchanged')
          else:
              source = source.replace(needle, 'false')
              path.write_text(source)
              print('Patched unavailable NWPath.isUltraConstrained for CI build')
          PY

      - name: Build signed iOS IPA
        run: |
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          flutter build ipa --release \
            --target=lib/main_production.dart \
            --build-name=1.0.0 \
            --build-number="$build_number" \
            --dart-define=API_BASE_URL=https://kabulfit.com/api/v1 \
            --export-options-plist=ios/ExportOptions.plist

      - name: Locate signed IPA
        id: ipa
        run: |
          ipa_file=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$ipa_file" ]; then
            echo "::error::The signed IPA was not produced"
            exit 1
          fi
          echo "path=$ipa_file" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight (opt-in)
        if: ${{ inputs.publish }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
